services:
  - type: web
    name: eden-vtc
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eden-vtc-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: prod
      # OTP_DEV_MODE=true : tant qu'aucun identifiant Twilio réel n'est
      # configuré, le code de vérification est renvoyé directement dans la
      # réponse de l'API (visible à l'écran côté app) au lieu d'être envoyé
      # par SMS. Pratique pour les démonstrations, à repasser à "false" une
      # fois Twilio branché en production.
      - key: OTP_DEV_MODE
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: PAYMENT_LIVE_MODE
        value: "false"

databases:
  - name: eden-vtc-db
    plan: free
    region: frankfurt
